services:
  - type: web
    name: comeback-room-backend-dev
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev,render
      - key: DB_HOST
        fromDatabase:
          name: comeback-room-postgres-dev
          property: host
      - key: DB_PORT
        fromDatabase:
          name: comeback-room-postgres-dev
          property: port
      - key: DB_NAME
        fromDatabase:
          name: comeback-room-postgres-dev
          property: database
      - key: DB_USER
        fromDatabase:
          name: comeback-room-postgres-dev
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: comeback-room-postgres-dev
          property: password
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: comeback-room-postgres-dev
    plan: free
    region: singapore
    databaseName: comebackroom
    user: comebackroom
    postgresMajorVersion: "17"
