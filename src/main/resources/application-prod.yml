spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  email:
    delivery-mode: ${EMAIL_DELIVERY_MODE:resend}
  refresh-token:
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:None}
